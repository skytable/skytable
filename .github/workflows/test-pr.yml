name: Test (PR)

on: [pull_request]
env:
  BUILD: false
  CARGO_TERM_COLOR: always
jobs:
  test:
    name: Test

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        build: [linux-stable, macos-stable, windows-stable]
        include:
          - build: linux-stable
            os: ubuntu-latest
            rust: stable
          - build: macos-stable
            os: macos-latest
            rust: stable
          - build: windows-stable
            os: windows-latest
            rust: stable

    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          fetch-depth: 2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}
      - name: Setup environment
        run: |
          chmod +x ci/buildvars.sh
          ci/buildvars.sh
        if: env.BUILD == 'true'
      - name: Run Tests
        run: make test
        env:
          RUST_BACKTRACE: 1
